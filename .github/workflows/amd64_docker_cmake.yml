# ref: https://github.com/docker-library/official-images
name: amd64 Docker CMake

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  cmake:
    strategy:
      matrix:
        distro: [alpine]
        lang: [cpp]
        # distro: [almalinux, alpine, archlinux, debian, fedora, opensuse, rockylinux, ubuntu]
        # lang: [cpp, python, dotnet, java]
      fail-fast: false
    name: amd64•${{matrix.distro}}•CMake•${{matrix.lang}}
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hour timeout, should be faster with optimizations
    steps:
      - uses: actions/checkout@v4
      
      # Enable Docker BuildKit for better performance and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
      
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.distro }}-${{ matrix.lang }}-${{ hashFiles('**/CMakeLists.txt', '**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.distro }}-${{ matrix.lang }}-
            ${{ runner.os }}-buildx-${{ matrix.distro }}-
            ${{ runner.os }}-buildx-
      # - name: Build base image
      #   run: make --directory=cmake amd64_${{matrix.distro}}_base
      # - name: Build env image
      #   run: make --directory=cmake amd64_${{matrix.distro}}_${{matrix.lang}}_env
      # - name: Build devel image
      #   run: make --directory=cmake amd64_${{matrix.distro}}_${{matrix.lang}}_devel
      # - name: Build project
      #   run: make --directory=cmake amd64_${{matrix.distro}}_${{matrix.lang}}_build
      # - name: Test project
      #   run: make --directory=cmake amd64_${{matrix.distro}}_${{matrix.lang}}_test

      # - name: Build install env image
      #   run: make --directory=cmake amd64_${{matrix.distro}}_${{matrix.lang}}_install_env
      - name: Build install devel image
        env:
          DOCKER_BUILDKIT: 1
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: |
          # Export cache options for faster builds
          export CACHE_FROM="type=local,src=/tmp/.buildx-cache"
          export CACHE_TO="type=local,dest=/tmp/.buildx-cache-new,mode=max"
          
          # Use buildx for better performance with registry caching
          docker buildx build \
            --platform linux/amd64 \
            --target install_devel \
            --tag ortools/cmake:amd64_${{matrix.distro}}_${{matrix.lang}}_install_devel \
            --cache-from $CACHE_FROM \
            --cache-to $CACHE_TO \
            --load \
            -f cmake/docker/${{matrix.distro}}/${{matrix.lang}}.Dockerfile \
            .
          
          # Replace old cache
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          
          mkdir -p artifacts/${{matrix.distro}}-${{matrix.lang}}
          # Extract binaries from the Docker container
          docker create --name temp_container ortools/cmake:amd64_${{matrix.distro}}_${{matrix.lang}}_install_devel
          docker cp temp_container:/usr/local/bin/. artifacts/${{matrix.distro}}-${{matrix.lang}}/bin/ || true
          docker cp temp_container:/usr/local/lib/. artifacts/${{matrix.distro}}-${{matrix.lang}}/lib/ || true
          docker cp temp_container:/usr/local/include/. artifacts/${{matrix.distro}}-${{matrix.lang}}/include/ || true
          docker rm temp_container
          # Create a tarball
          tar -czf or-tools-${{matrix.distro}}-${{matrix.lang}}-amd64.tar.gz -C artifacts/${{matrix.distro}}-${{matrix.lang}} .
      # - name: Build install project
      #   run: make --directory=cmake amd64_${{matrix.distro}}_${{matrix.lang}}_install_build
      # - name: Test install project
      #   run: make --directory=cmake amd64_${{matrix.distro}}_${{matrix.lang}}_install_test
            
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: or-tools-${{matrix.distro}}-${{matrix.lang}}-amd64
          path: or-tools-${{matrix.distro}}-${{matrix.lang}}-amd64.tar.gz
          retention-days: 30

      - name: Create Release (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Create release using GitHub CLI
          gh release create ${{ github.ref_name }} \
            or-tools-${{matrix.distro}}-${{matrix.lang}}-amd64.tar.gz \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
