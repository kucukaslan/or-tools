# ref: https://github.com/actions/runner-images
name: arm64 MacOS CMake C++

on: 
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
jobs:
  native:
    strategy:
      matrix:
        cmake: [
          #          {name: "Xcode", generator: "Xcode", config: Release, build_target: ALL_BUILD, test_target: RUN_TESTS, install_target: install},
          {name: "Make", generator: "Unix Makefiles", config: Release, build_target: all, test_target: test, install_target: install},
        ]
      fail-fast: false
    name: arm64•MacOS•CMake(${{matrix.cmake.name}})•C++
    runs-on: macos-latest # macos M1 based runner
    steps:
      - uses: actions/checkout@v4
      - name: Check CMake
        run: cmake --version
      - name: Configure
        run: >
          cmake -S. -Bbuild
          -G "${{matrix.cmake.generator}}"
          -DCMAKE_BUILD_TYPE=${{matrix.cmake.config}}
          -DBUILD_DEPS=ON
          -DCMAKE_INSTALL_PREFIX=install
      - name: Build
        run: >
          cmake --build build
          --config ${{matrix.cmake.config}}
          --target ${{matrix.cmake.build_target}}
          -v -j2
      #      - name: Test
      #        run: >
      #          CTEST_OUTPUT_ON_FAILURE=1
      #          cmake --build build
      #          --config ${{matrix.cmake.config}}
      #          --target ${{matrix.cmake.test_target}}
      #          -v
      - name: Install
        run: >
          cmake --build build
          --config ${{matrix.cmake.config}}
          --target ${{matrix.cmake.install_target}}
          -v
      - name: Create Archive
        run: |
          cd install
          tar -czf ../ortools-arm64-macos-${{matrix.cmake.name}}-${{github.sha}}.tar.gz *
          cd ..
          ls -la *.tar.gz
      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: ortools-arm64-macos-${{matrix.cmake.name}}-build
          path: "*.tar.gz"
          retention-days: 30

      - name: Add to Release (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Check if release exists, if not wait for the amd64 workflow to create it
          max_attempts=12
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if gh release view ${{ github.ref_name }} >/dev/null 2>&1; then
              echo "Release found, uploading artifacts..."
              gh release upload ${{ github.ref_name }} \
                ortools-arm64-macos-${{matrix.cmake.name}}-${{github.sha}}.tar.gz \
                --clobber
              break
            else
              echo "Release not found, waiting... (attempt $((attempt+1))/$max_attempts)"
              sleep 30
              attempt=$((attempt+1))
            fi
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "Release not found after waiting, creating it..."
            gh release create ${{ github.ref_name }} \
              ortools-arm64-macos-${{matrix.cmake.name}}-${{github.sha}}.tar.gz \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  arm64_macos_cmake_cpp:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
